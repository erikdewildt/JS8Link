name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --all-groups --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run backend tests
        run: uv run pytest --cov=js8link --cov-report=term-missing
        working-directory: backend

      - name: Run frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Run frontend end-to-end tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Run all checks
        run: |
          python scripts/version.py check
          (cd backend && uv run ruff check . && uv run pyright src/ && uv run pytest --collect-only -q >/dev/null)
          (cd frontend && npm run lint && npm run format:check && npm run typecheck && npm run build)

  packaged-smoke:
    name: Packaged executable (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install build Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --project backend --python 3.12 --all-groups --locked

      - name: Build executable
        run: uv run --project backend python scripts/build-executable.py

      - name: Start and probe executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            executable="./dist/JS8Link.app/Contents/MacOS/JS8Link"
          else
            executable="./dist/JS8Link/JS8Link"
          fi
          "$executable" --no-browser --data-dir "$RUNNER_TEMP/js8link-data" --port 18008 >"$RUNNER_TEMP/js8link.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18008/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:18008/api/health >/dev/null; then
            cat "$RUNNER_TEMP/js8link.log"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18008/ >/dev/null

      - name: Start and probe executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\JS8Link\JS8Link.exe -ArgumentList '--no-browser','--data-dir',"$env:RUNNER_TEMP\js8link-data",'--port','18008' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:18008/api/health -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged JS8Link health endpoint did not become ready' }
            Invoke-WebRequest http://127.0.0.1:18008/ -UseBasicParsing | Out-Null
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

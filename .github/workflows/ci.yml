name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --all-groups --locked

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run backend tests
        run: |
          export JS8LINK_DATA_DIR="$RUNNER_TEMP/js8link-test-data"
          uv run alembic upgrade head
          uv run pytest --cov=js8link --cov-report=term-missing
        working-directory: backend

      - name: Run frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Run frontend end-to-end tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Run all checks
        run: |
          python scripts/version.py check
          (cd backend && uv run ruff check . && uv run pyright src/ && uv run pytest --collect-only -q >/dev/null)
          (cd frontend && npm run lint && npm run format:check && npm run typecheck && npm run build)

  packaged-smoke:
    name: Packaged executable (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install build Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --project backend --python 3.12 --all-groups --locked

      - name: Build executable
        run: uv run --project backend python scripts/build-executable.py

      - name: Start and probe executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            executable="./dist/JS8Link.app/Contents/MacOS/JS8Link"
          else
            executable="./dist/JS8Link/JS8Link"
          fi
          "$executable" --no-browser --data-dir "$RUNNER_TEMP/js8link-data" --port 18008 >"$RUNNER_TEMP/js8link.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Packaged JS8Link exited before becoming ready' >&2
              cat "$RUNNER_TEMP/js8link.log"
              exit 1
            fi
            if curl --fail --silent --max-time 5 http://127.0.0.1:18008/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18008/api/health >/dev/null; then
            cat "$RUNNER_TEMP/js8link.log"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18008/ >/dev/null
          echo '--- JS8Link executable output ---'
          cat "$RUNNER_TEMP/js8link.log"

      - name: Start and probe executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'js8link.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'js8link.stderr.log'
          $process = Start-Process -FilePath .\dist\JS8Link\JS8Link.exe -ArgumentList '--no-browser','--data-dir',"$env:RUNNER_TEMP\js8link-data",'--port','18008' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($process.HasExited) { throw 'Packaged JS8Link exited before becoming ready' }
              try {
                Invoke-WebRequest http://127.0.0.1:18008/api/health -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged JS8Link health endpoint did not become ready' }
            Invoke-WebRequest http://127.0.0.1:18008/ -UseBasicParsing | Out-Null
            Write-Host '--- JS8Link executable stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- JS8Link executable stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload executable startup logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-smoke-log-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/js8link.log
            ${{ runner.temp }}/js8link.stdout.log
            ${{ runner.temp }}/js8link.stderr.log
          if-no-files-found: ignore
          retention-days: 7

name: Build and publish JS8Link alpha release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.base.ref == 'main'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            archive: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-14
            platform: macos-arm64
            archive: dmg
          - os: macos-15-intel
            platform: macos-x86_64
            archive: dmg
    steps:
      - name: Check out the exact merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read and validate version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Archive: JS8Link-$version-${{ matrix.platform }}.${{ matrix.archive }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Python 3.12 is the conservative PyInstaller runtime for macOS;
          # newer interpreter builds can omit the shared library from the
          # frozen executable on GitHub-hosted macOS runners.
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install portable build Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --project backend --python 3.12 --all-groups --locked

      - name: Build the onedir executable
        shell: bash
        run: uv run --project backend python scripts/build-executable.py

      - name: Smoke-test the packaged executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            executable="./dist/JS8Link.app/Contents/MacOS/JS8Link"
          else
            executable="./dist/JS8Link/JS8Link"
          fi
          "$executable" --no-browser --data-dir "$RUNNER_TEMP/js8link-data" --port 18008 >"$RUNNER_TEMP/js8link.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Packaged JS8Link exited before becoming ready' >&2
              cat "$RUNNER_TEMP/js8link.log"
              exit 1
            fi
            if curl --fail --silent --max-time 5 http://127.0.0.1:18008/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18008/api/health >/dev/null; then
            echo 'Packaged JS8Link health endpoint did not become ready' >&2
            cat "$RUNNER_TEMP/js8link.log"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18008/ >/dev/null
          echo '--- JS8Link executable output ---'
          cat "$RUNNER_TEMP/js8link.log"

      - name: Smoke-test the packaged executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'js8link.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'js8link.stderr.log'
          $process = Start-Process -FilePath .\dist\JS8Link\JS8Link.exe -ArgumentList '--no-browser','--data-dir',"$env:RUNNER_TEMP\js8link-data",'--port','18008' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($process.HasExited) { throw 'Packaged JS8Link exited before becoming ready' }
              try {
                Invoke-WebRequest http://127.0.0.1:18008/api/health -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged JS8Link health endpoint did not become ready' }
            Invoke-WebRequest http://127.0.0.1:18008/ -UseBasicParsing | Out-Null
            Write-Host '--- JS8Link executable stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- JS8Link executable stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload executable startup logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-smoke-log-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/js8link.log
            ${{ runner.temp }}/js8link.stdout.log
            ${{ runner.temp }}/js8link.stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md, packaging\Start-JS8Link.bat -Destination dist\JS8Link
          Compress-Archive -Path dist\JS8Link -DestinationPath "release\JS8Link-$env:VERSION-${{ matrix.platform }}.zip"

      - name: Create release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            macos_bundle="$RUNNER_TEMP/js8link-macos-bundle"
            rm -rf "$macos_bundle"
            mkdir -p "$macos_bundle"
            cp -R dist/JS8Link.app "$macos_bundle/JS8Link.app"
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "$macos_bundle/"
            hdiutil create \
              -volname JS8Link \
              -srcfolder "$macos_bundle" \
              -ov \
              -format UDZO \
              "release/JS8Link-$VERSION-${{ matrix.platform }}.dmg"
          else
            cp LICENSE README.md THIRD_PARTY_NOTICES.md packaging/start-js8link.sh dist/JS8Link/
            chmod +x dist/JS8Link/start-js8link.sh
            tar -czf "release/JS8Link-$VERSION-${{ matrix.platform }}.tar.gz" -C dist JS8Link
          fi

      - name: Upload platform archive
        uses: actions/upload-artifact@v6
        with:
          name: JS8Link-${{ matrix.platform }}
          path: release/*

  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.base.ref == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Prepare release and prevent duplicate tags
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: JS8Link-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum release/* > release/SHA256SUMS.txt

      - name: Tag the exact merge commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.metadata.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}" -m "JS8Link ${{ steps.metadata.outputs.version }} Alpha"
          git push origin "${{ steps.metadata.outputs.tag }}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" release/* \
            --title "JS8Link ${{ steps.metadata.outputs.version }} Alpha" \
            --prerelease \
            --notes "JS8Link ${{ steps.metadata.outputs.version }} Alpha\n\nThis is an alpha release. JS8Call must be running with its TCP API enabled. JS8Link connects over TCP to 127.0.0.1:2442 by default.\n\nLicense: GNU General Public License v3.0 (GPL-3.0-only)."

# macOS signing and notarization can be added before archive upload once
# Developer ID credentials and App Store Connect secrets are available.

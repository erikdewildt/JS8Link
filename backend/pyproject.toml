[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "js8link-backend"
version = "0.0.1"
description = "Web interface for JS8Call-improved"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "platformdirs>=4.3,<5",
  "packaging>=24,<26",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "hatchling>=1.27,<2",
  "ty>=0.0.1",
  "pyright>=1.1.411",
  "pyinstaller>=6.10,<7",
  "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/js8link"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["js8link"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["../scripts/install.py"]
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportMissingParameterType = false
reportUnusedCallResult = false
reportCallInDefaultInitializer = false
reportDeprecated = false
